name: PR Agent

# Reviews the diff with the model named by the PR Agent defaults. The diff is
# sent to that provider; do not put transcripts, .env values, or other private
# material in a pull request. No checkout: the action reads the diff from the
# GitHub API, so pull-request code never runs next to the API key.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

permissions:
  contents: read

jobs:
  review:
    name: Review
    # Same-repository pulls only, so a fork cannot spend the key. Comments that
    # invoke /review are limited to people who can already write to the repo.
    if: >-
      (github.event.sender.login == 'dependabot[bot]' || github.event.sender.type != 'Bot') &&
      (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.draft == false &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
    steps:
      - name: Review, describe, and suggest
        if: env.OPENAI_KEY != ''
        uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430 # v0.49.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.persistent_comment: "true"

      - name: Note when the review key is missing
        if: env.OPENAI_KEY == ''
        run: >-
          echo "::warning::PR Agent did not review this pull request.
          Add an OPENAI_KEY repository secret (Settings, Secrets and variables, Actions)."
