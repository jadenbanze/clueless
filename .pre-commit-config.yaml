# Install once:  pipx install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
#
# Every hook here also runs in CI (.github/workflows/ci.yml), so skipping it
# locally only delays the failure.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=800]
      - id: check-merge-conflict
      - id: check-json
        exclude: ^overlay/package-lock\.json$
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # .env holds live credentials and must never be staged, even by accident.
      - id: forbid-new-submodules

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q]
        additional_dependencies: ["bandit[toml]"]
        files: ^(server|scripts)/.*\.py$

  - repo: local
    hooks:
      # Organisation-specific terms (company names, internal project keys,
      # colleagues' names) listed one per line in an untracked .denylist file.
      # Generic secret scanners cannot know these; this hook can.
      - id: denylist
        name: denylist (organisation-specific terms)
        entry: scripts/denylist-check.sh
        language: script
        pass_filenames: true
      - id: no-env-files
        name: never commit .env files
        entry: .env files hold credentials; use .env.example
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$
      - id: eslint
        name: eslint (overlay)
        entry: bash -c 'cd overlay && npx --no-install eslint --max-warnings=0 .'
        language: system
        files: ^overlay/.*\.js$
        pass_filenames: false
