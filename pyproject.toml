# Tool configuration only. The Python code ships inside the app bundle and is
# not published as a package; runtime dependencies live in requirements.txt.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["native/build", "overlay"]

[tool.ruff.lint]
# E/F: correctness. S: flake8-bandit security rules, which overlap bandit but
# run on every save in editors. B: likely bugs.
select = ["E", "F", "S", "B"]
ignore = [
    "E501",   # long comments are deliberate documentation here
    "S101",   # assert is used in tests
    "S603",   # subprocess without shell — every call passes an argv list
    "S607",   # partial paths: helpers like `open`, `pkill`, `git` are resolved via PATH by design
    "S108",   # /tmp use is limited to per-run temp files from tempfile
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"server/test_*.py" = ["S", "B"]

[tool.bandit]
exclude_dirs = ["native/build", "overlay/node_modules", ".venv"]
# Same rationale as the ruff ignores above. B301/B506/B602/B307 (pickle,
# yaml.load, shell=True, eval) are deliberately NOT skipped.
skips = ["B101", "B603", "B607", "B404", "B108"]
